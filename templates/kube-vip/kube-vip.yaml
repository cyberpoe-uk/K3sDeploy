apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-vip, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: system:kube-vip-role}
rules:
- apiGroups: [""]
  resources: ["services", "services/status", "nodes", "endpoints"]
  verbs: ["list", "get", "watch", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["list", "get", "watch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: system:kube-vip-binding}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:kube-vip-role}
subjects: [{kind: ServiceAccount, name: kube-vip, namespace: kube-system}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: kube-vip, namespace: kube-system}
spec:
  selector: {matchLabels: {app: kube-vip}}
  template:
    metadata: {labels: {app: kube-vip}}
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      tolerations: [{operator: Exists}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: node-role.kubernetes.io/master, operator: Exists}
            - matchExpressions:
              - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      containers:
      - name: kube-vip
        image: ghcr.io/kube-vip/kube-vip:__VERSION__
        args: [manager]
        securityContext:
          capabilities:
            add: [NET_ADMIN, NET_RAW]
            drop: [ALL]
        env:
        - {name: vip_arp, value: "true"}
        - {name: port, value: "6443"}
        - name: vip_nodename
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - {name: vip_subnet, value: "32"}
        - {name: cp_enable, value: "true"}
        - {name: cp_namespace, value: kube-system}
        - {name: svc_enable, value: "false"}
        - {name: vip_leaderelection, value: "true"}
        - {name: address, value: __VIP__}
        - {name: vip_ddns, value: "false"}
        - {name: vip_leaseduration, value: "5"}
        - {name: vip_renewdeadline, value: "3"}
        - {name: vip_retryperiod, value: "1"}
